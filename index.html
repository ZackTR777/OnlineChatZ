<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{font-family:"Trebuchet MS",Arial,sans-serif;color:#45200f;font-weight:800;--outline:#45200f}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#ffc729;overscroll-behavior:none;touch-action:none}

<body>
<main id="game" aria-label="Meme Island Sun Run platform game">
  <canvas id="world" aria-label="Game world: jump between grassy islands, collect coins, and reach the checkered flag.">Your browser needs Canvas to play this game.</canvas>
  <div class="hud hidden" id="hud">
    <div class="hud-left">
      <div class="pill"><span id="level-label" class="level-label">ISLAND 1 / 3</span><span id="level-name" class="level-name">Sunshine Shores</span></div>
      <div class="pill" aria-label="Coins"><span class="coin-mark" aria-hidden="true">I</span><span id="coin-count">0</span><span style="opacity:.55"> / </span><span id="coin-total">0</span></div>
      <div class="pill hearts" id="hearts" aria-label="3 hearts">♥♥♥</div>
    </div>
    <div class="hud-right">
      <button class="utility" id="sound" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><path class="sound-wave" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></button>
      <button class="utility" id="pause" aria-label="Pause game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
  </div>
  <div class="progress-strip hidden" id="progress" aria-hidden="true"><span id="progress-fill"></span></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="controls hidden" id="controls" aria-label="Touch controls">
    <div class="move-pad">
      <button class="control" id="left" aria-label="Move left">◀</button>
      <button class="control" id="right" aria-label="Move right">▶</button>
    </div>
    <div class="action-pad"><button class="control attack" id="attack" aria-label="Fire stars, hold for continuous fire"><span class="arrow" aria-hidden="true">✦</span><span>FIRE</span></button><button class="control jump" id="jump" aria-label="Jump, tap again in the air for a double jump"><span class="arrow" aria-hidden="true">↑</span><span>JUMP</span></button></div>
  </div>
  <div class="control-hint hidden" id="hint">Tap jump again in the air · Hold FIRE to shoot stars</div>
  <div class="sr-only" id="boss-accessible" role="progressbar" aria-label="Boss health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div>
  <div class="overlay" id="overlay"></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
</main>

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

  },
  {

    if(h.life<=0||h.x<boss.left-50||h.x>level.width+30||h.y>560)hazards.splice(i,1);

function updateMoving(dt){for(const p of level.platforms){const ox=p.x,oy=p.y;if(p.moving){const v=Math.sin(worldTime*p.speed)*p.range;if(p.axis==='x')p.x=p.baseX+v;else p.y=p.baseY+v;}p.dx=p.x-ox;p.dy=p.y-oy;}}

  p.invuln=Math.max(0,p.invuln-dt);jumpBuffer=Math.max(0,jumpBuffer-dt);coyote=p.ground?.1:Math.max(0,coyote-dt);

function drawCombat(){

  for(const s of shots){ctx.save();ctx.shadowColor='#ffe166';ctx.shadowBlur=15;for(let i=s.trail.length-1;i>=0;i--){const t=s.trail[i];ctx.globalAlpha=(1-i/7)*.35;star(ctx,t.x-cameraX,t.y+offsetY,8-i*.65,'#ffdb50',null,decorTime*10);}ctx.globalAlpha=1;star(ctx,s.x-cameraX,s.y+offsetY,12,'#fff4af','#ed9218',decorTime*11);ctx.restore();}
  for(const h of hazards){const x=h.x-cameraX,y=h.y+offsetY;ctx.save();
    if(h.kind==='wave'){ctx.shadowColor=h.color;ctx.shadowBlur=14;ctx.strokeStyle=h.color;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,y+4,18,13,0,Math.PI,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(x-(h.vx>0?14:-14),y+8,15,9,0,Math.PI,Math.PI*2);ctx.globalAlpha=.4;ctx.stroke();}
    else if(h.kind==='impact'){ctx.globalAlpha=Math.max(0,h.life/.25);star(ctx,x,y,50,boss.color,null,decorTime);}
    else if(h.kind==='rock'){ctx.translate(x,y);ctx.rotate(decorTime*4);ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rad=h.r*(i%2?.91:1);if(i===0)ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);else ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);}ctx.closePath();const g=ctx.createLinearGradient(-15,-17,15,18);g.addColorStop(0,'#bac595');g.addColorStop(1,'#48553d');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#182a21';ctx.stroke();ctx.strokeStyle='#91f63d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,-12);ctx.lineTo(4,-1);ctx.lineTo(-2,13);ctx.stroke();}
    else{const fire=h.kind==='fire';ctx.shadowColor=fire?'#ff8a1b':'#68f4ff';ctx.shadowBlur=16;if(h.trail)for(let i=h.trail.length-1;i>=0;i--){const t=h.trail[i];ctx.globalAlpha=(1-i/8)*.35;ctx.fillStyle=fire?'#ff8425':'#64e9f9';ctx.beginPath();ctx.arc(t.x-cameraX,t.y+offsetY,h.r*(1-i/10),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;const g=ctx.createRadialGradient(x-4,y-5,2,x,y,h.r);g.addColorStop(0,fire?'#fffba7':'#e8ffff');g.addColorStop(.4,fire?'#ffd640':'#a9faff');g.addColorStop(1,fire?'#f25712':'#2696d1');ctx.beginPath();ctx.arc(x,y,h.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=fire?'#cc5915':'#48dced';ctx.lineWidth=2.5;ctx.stroke();if(fire){ctx.strokeStyle='#aa441533';ctx.beginPath();ctx.moveTo(x-7,y-9);ctx.lineTo(x+3,y-2);ctx.lineTo(x-5,y+7);ctx.stroke();}else{ctx.beginPath();ctx.ellipse(x-5,y-6,5,3,-.6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}}
    ctx.restore();
  }
  for(const f of floaters){ctx.save();ctx.globalAlpha=Math.min(1,f.life*3);ctx.font='900 18px Arial, sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#1a152a';ctx.strokeText(f.label,f.x-cameraX,f.y+offsetY);ctx.fillStyle=f.color;ctx.fillText(f.label,f.x-cameraX,f.y+offsetY);ctx.restore();}
}
function drawAmbient(){
  const lava=level.palette===2;ctx.save();
  for(let i=0;i<(lava?39:20);i++){const x=(i*151.7+Math.sin(decorTime*.7+i)*14-cameraX*.06+vw*5)%vw,y=vh-((decorTime*(lava?24:9)+i*87.3)%(vh*.87));const r=1+i%3;ctx.globalAlpha=.2+(i%4)*.1;
    if(lava){ctx.fillStyle=i%3?'#ffa12f':'#fff3a1';ctx.beginPath();ctx.ellipse(x,y,r*.6,r*1.2,.4,0,Math.PI*2);ctx.fill();}
    else if(level.palette===1){ctx.strokeStyle='#b7effc';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(x,y,r+1,0,Math.PI*2);ctx.stroke();}
    else{ctx.fillStyle='#d3ff9d';ctx.beginPath();ctx.arc(x,y,r*.55,0,Math.PI*2);ctx.fill();}}
  ctx.restore();
}
function drawBossHealth(){
  const b=boss;if(!b?.active||state==='menu'||state==='complete'||state==='gameover')return;
  const cssWidth=vw*scale,narrow=cssWidth<=560,baseTop=narrow?116:78;
  let safe=0;if(typeof getComputedStyle==='function')safe=Math.max(0,(parseFloat(getComputedStyle($('hud')).top)||0)-(narrow?10:12));
  const width=Math.min(520,cssWidth-34)/scale,height=54/scale,left=(vw-width)/2,top=(baseTop+safe)/scale,pad=12/scale;
  ctx.save();roundedPath(ctx,left,top,width,height,13/scale);const panel=ctx.createLinearGradient(0,top,0,top+height);panel.addColorStop(0,'#243a5d');panel.addColorStop(1,'#0d1734');ctx.fillStyle=panel;ctx.fill();ctx.strokeStyle=b.defeated?'#c7f87a':'#e4a449';ctx.lineWidth=2.5/scale;ctx.stroke();
  ctx.fillStyle='#ffebae';ctx.font=`900 ${14/scale}px Arial, sans-serif`;ctx.textAlign='left';ctx.fillText(b.name.toUpperCase()+' · HP',left+pad,top+20/scale);
  const phase=b.defeated?'DEFEATED':b.intro>0?'BOSS BATTLE':b.phase==='recover'?'FIRE NOW!':b.phase==='windup'?({slam:'SLAM INCOMING',meteor:'METEOR SHOWER',fan:b.index===1?'BUBBLE BURST':'FIREBALL VOLLEY',rock:'BOULDER ROLL'}[b.pattern]):b.phase==='attack'?'DODGE!':b.rage?'ENRAGED / SHIELD':'SHIELDED';
  ctx.textAlign='right';ctx.font=`900 ${11/scale}px Arial, sans-serif`;ctx.fillStyle=b.phase==='recover'?'#c1fb9c':'#ffc888';ctx.fillText(phase,left+width-pad,top+20/scale);
  const barX=left+pad,barY=top+29/scale,barW=width-pad*2,barH=14/scale;roundedPath(ctx,barX,barY,barW,barH,6/scale);ctx.fillStyle='#090e24';ctx.fill();if(b.hp>0){roundedPath(ctx,barX,barY,Math.max(4/scale,barW*b.hp/b.maxHp),barH,6/scale);const hp=ctx.createLinearGradient(0,barY,0,barY+barH);hp.addColorStop(0,b.phase==='recover'?'#b5f348':'#ffc249');hp.addColorStop(1,b.phase==='recover'?'#409a2d':'#ec5030');ctx.fillStyle=hp;ctx.fill();}
  ctx.textAlign='center';ctx.font=`900 ${11/scale}px Arial, sans-serif`;ctx.strokeStyle='#1a1523';ctx.lineWidth=2/scale;ctx.strokeText(b.hp+' / '+b.maxHp,left+width/2,barY+11/scale);ctx.fillStyle='#fffde6';ctx.fillText(b.hp+' / '+b.maxHp,left+width/2,barY+11/scale);ctx.restore();
}
function render(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);ctx.imageSmoothingEnabled=true;
  ctx.save();if(shake)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));background();
  if(level){
    for(const p of level.platforms){if(p.x+p.w<cameraX-15||p.x>cameraX+vw+15)continue;ctx.drawImage(p.tex,p.x-cameraX-6,p.y+offsetY-4);if(p.moving){ctx.fillStyle='#fff3a5';ctx.font='800 15px Arial, sans-serif';ctx.textAlign='center';ctx.fillText(p.axis==='x'?'↔':'↕',p.x+p.w/2-cameraX,p.y+offsetY+31);}}
    drawWarnings();drawBoss();
    for(const c of level.coins)drawCoin(c);for(const s of level.suns)drawSun(s);for(const h of level.heals)drawHeal(h);for(const s of level.spikes)drawSpikes(s);for(const s of level.springs)drawSpring(s);for(const e of level.enemies)drawEnemy(e);
    flag(level.checkpoint.x,level.checkpoint.y,false,!!checkpoint);if(!boss||boss.defeated)flag(level.flag.x,level.flag.y,true);
    if(cameraX<300){ctx.fillStyle='#905a1d';ctx.font='900 15px Arial, sans-serif';ctx.textAlign='center';ctx.fillText('ADVENTURE THIS WAY →',210-cameraX,440+offsetY+84);}
    drawPlayer();
    drawCombat();
    for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/(p.confetti?.5:p.max));ctx.fillStyle=p.color;const x=p.x-cameraX,y=p.y+offsetY;if(p.confetti){ctx.save();ctx.translate(x,y);ctx.rotate(p.life*4);ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.65);ctx.restore();}else{ctx.beginPath();ctx.arc(x,y,p.size*Math.min(1,p.life/p.max+.3),0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;
  }
  wave(offsetY+559,19,level.palette===2?'#ff8515':'#18a2e9',level.palette===2?'#fff07b':'#42c5f1',decorTime*1.1,1.8);
  wave(offsetY+592,15,level.palette===2?'#e94312':'#0873c3',level.palette===2?'#ffb02c':'#0c8ed5',-decorTime*.65,.3);
  for(let i=0;i<5;i++){const x=(i*177+decorTime*8-cameraX*.05)%Math.max(vw,920);const y=offsetY+573+Math.sin(i*3+decorTime)*8;ctx.beginPath();ctx.ellipse(x,y,14,2.5,0,0,Math.PI*2);ctx.fillStyle='#91e7ff33';ctx.fill();}
  ctx.restore();
  drawAmbient();if(flash>0){ctx.fillStyle=`rgba(255,227,155,${flash})`;ctx.fillRect(0,0,vw,vh);}drawBossHealth();
}
let last=0,accumulator=0;
function loop(ms){if(!last)last=ms;const delta=Math.min((ms-last)/1000,.05);last=ms;accumulator+=delta;while(accumulator>=1/120){step(1/120);accumulator-=1/120;}render();requestAnimationFrame(loop);}
menu();requestAnimationFrame(loop);
// A read-only snapshot makes gameplay and mobile controls straightforward to verify.
Object.defineProperty(window,'sunRun',{value:Object.freeze({getSnapshot:()=>({state,levelIndex,hearts,collected,suns,elapsed,practiceMode,player:player?{x:player.x,y:player.y,vx:player.vx,vy:player.vy,grounded:!!player.ground,airJumps:player.airJumps}:null,boss:boss?{name:boss.name,hp:boss.hp,maxHp:boss.maxHp,active:boss.active,defeated:boss.defeated,phase:boss.phase,pattern:boss.pattern,rage:boss.rage}:null,shots:shots.length,hazards:hazards.length,cameraX,checkpoint:!!checkpoint,input:{...input},unlocked,best:[...best],view:{width:vw,height:vh},assetReady:heroImage.complete&&heroImage.naturalWidth>0,bossAssetsReady:bossImages.every(i=>i.complete&&i.naturalWidth>0)})})});
})();
</script>
